version: 2.1

orbs:
  shellcheck: circleci/shellcheck@3.4.0
  codecov: codecov/codecov@6.0.0

workflows:
  commit:
    jobs:
      - shellcheck/check:
          dir: src/
          external_sources: true
      - test
      - fmt
  nightly:
    triggers:
      - schedule:
          cron: 0 0 * * *
          filters:
            branches:
              only:
                - master
    jobs:
      - shellcheck/check:
          dir: src/
          external_sources: true
      - test
      - fmt

jobs:
  test:
    docker:
      - image: particleflux/circleci-bats-kcov:7.0.0@sha256:a1534f6ca2964ad85d1344a274493afcb01557de2409e7d4947ba5508556c80a

    steps:
      - checkout

      - run:
          name: Install test dependencies
          command: |
            sudo apt update && sudo apt install -y gnupg
            
            shellmock_version=1.0
            curl -sSL "https://github.com/capitalone/bash_shell_mock/archive/$shellmock_version.tar.gz" | tar xvz -C /tmp
            cd "/tmp/bash_shell_mock-$shellmock_version/"
            ./install.sh $HOME

      - run:
          name: Run tests
          command: |
            export PATH="$HOME/bin:$PATH"

            # a normal test run before the coverage one; it has better output
            bats -F junit tests/ | tee tests/junit.xml

            kcov --include-path=. --exclude-path=tests coverage bats tests/ &> /dev/null

      - codecov/upload:
          report_type: test_results
      - codecov/upload:
          report_type: coverage
          disable_search: true
          files: "coverage/bats*/cobertura.xml"

      - store_artifacts:
          path: coverage
      - store_test_results:
          path: tests

  fmt:
    docker:
      - image: cimg/base:2026.10@sha256:7dcf4c15fa0b8c919183b10623aee9444ba08c14eada03c25531aac972cde3ef
    environment:
      SHFMT_VERSION: 3.1.1

    steps:
      - checkout
      - run:
          name: Fetch dependencies
          command: |
            curl -sSL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
              -o /tmp/shfmt
            chmod +x /tmp/shfmt

      - run:
          name: Check formatting
          command: |
            /tmp/shfmt -i 2 -ci -d src
