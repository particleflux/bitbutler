version: 2.1

orbs:
  shellcheck: circleci/shellcheck@3.4.0
  codecov: codecov/codecov@6.1.0

workflows:
  commit:
    jobs:
      - shellcheck/check:
          dir: src/
          external_sources: true
      - test
      - fmt
  nightly:
    triggers:
      - schedule:
          cron: 0 0 * * *
          filters:
            branches:
              only:
                - master
    jobs:
      - shellcheck/check:
          dir: src/
          external_sources: true
      - test
      - fmt

jobs:
  test:
    docker:
      - image: particleflux/circleci-bats-kcov:7.0.0@sha256:d4e5ef65fd493cb2c96dfd007ab38a6f9b7a6911d492d92a63b1f09a8d4ec438

    steps:
      - checkout

      - run:
          name: Install test dependencies
          command: |
            sudo apt update && sudo apt install -y gnupg
            
            shellmock_version=1.0
            curl -sSL "https://github.com/capitalone/bash_shell_mock/archive/$shellmock_version.tar.gz" | tar xvz -C /tmp
            cd "/tmp/bash_shell_mock-$shellmock_version/"
            ./install.sh $HOME

      - run:
          name: Run tests
          command: |
            export PATH="$HOME/bin:$PATH"

            # a normal test run before the coverage one; it has better output
            bats -F junit tests/ | tee tests/junit.xml

            kcov --include-path=. --exclude-path=tests coverage bats tests/ &> /dev/null

      - codecov/upload:
          report_type: test_results
      - codecov/upload:
          report_type: coverage
          disable_search: true
          files: "coverage/bats*/cobertura.xml"

      - store_artifacts:
          path: coverage
      - store_test_results:
          path: tests

  fmt:
    docker:
      - image: cimg/base:2026.11@sha256:4e57f523172e8f5bbf9cb57393b80c964ac0e6c75ee70ebd8c980d11bb503c01
    environment:
      SHFMT_VERSION: 3.1.1

    steps:
      - checkout
      - run:
          name: Fetch dependencies
          command: |
            curl -sSL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
              -o /tmp/shfmt
            chmod +x /tmp/shfmt

      - run:
          name: Check formatting
          command: |
            /tmp/shfmt -i 2 -ci -d src
